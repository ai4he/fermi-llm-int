# nginx reverse proxy for the Fermi-LLM web app.
# Serves port 80 and forwards to the unprivileged app on 127.0.0.1:8765.
# Installed to /etc/nginx/sites-available/fermi-llm by deploy/setup_nginx.sh.

# WebSocket upgrade mapping (http-level). Kept here for self-containment; the
# setup script also drops a copy in conf.d so it is loaded at http scope.
map $http_upgrade $fermi_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name thanos.science.clemson.edu _;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (the app uses /ws/{session})
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $fermi_connection_upgrade;

        # Server-Sent Events / long-lived streams: no buffering, long timeouts
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
