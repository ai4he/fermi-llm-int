# Conda environment for Fermi-LLM. The Fermi Science Tools and FermiPy are
# installed via conda because they ship native binaries (gtselect, gtmktime,
# gtltcube, etc.) that are not available from PyPI.
#
# Create with:
#
#     conda env create -f environment.yml
#     conda activate fermi-llm
#
# After activation, install the Python dependencies for the web server:
#
#     pip install -r requirements.txt
#     # Optional, for local Hugging Face GPU generation:
#     pip install -r requirements-local.txt

name: fermi-llm
channels:
  - conda-forge
  - fermi
  - defaults
dependencies:
  - python=3.11
  - pip
  # The Fermi Science Tools (gtselect, gtmktime, gtltcube, gtsrcmaps, etc.) and
  # FermiPy itself come from the dedicated Fermi conda channel.
  - fermi::fermitools=2.5.1
  - fermi::fermipy=1.4.1
  # Scientific Python stack used by FermiPy and our pipeline.
  - numpy
  - scipy
  - matplotlib
  - astropy
  - healpy
  - pyyaml
  - requests
  - pip:
      - -r requirements.txt
